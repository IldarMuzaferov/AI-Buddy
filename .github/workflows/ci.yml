name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buddy
          POSTGRES_PASSWORD: buddy
          POSTGRES_DB: buddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buddy" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check app tests
      - name: Tests + coverage (порог 80%)
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+asyncpg://buddy:buddy@localhost:5432/buddy_test' || 'sqlite+aiosqlite://' }}
        run: python -m pytest -q --cov=app --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=80
      - name: Eval (40+ вопросов)
        if: matrix.db == 'sqlite'
        env:
          PYTHONPATH: ../../mcp/mock-corp
        run: python -m app.cli eval
      - uses: actions/upload-artifact@v4
        if: always() && matrix.db == 'sqlite'
        with:
          name: coverage-backend
          path: apps/api/coverage.xml
